# Rotate OS frontend + rotate-swiveld configuration. Lines starting with # or ; are comments.
# Core file names = what the Arch Linux ARM libretro-* packages install in /usr/lib/libretro (file lists from
# http://mirror.archlinuxarm.org/aarch64/extra/extra.files, 2026-10-31); `core = X` resolves to cores_dir/X_libretro.so.
# Checked against the built rootfs by build/README.md "Core check". Selection rationale: build/README.md "Cores".

[paths]
roms_root = /roms
state_dir = /var/lib/rotate
sysfs_root = /sys
socket = /run/rotate-swiveld.sock

[retroarch]
bin = /usr/bin/retroarch
config = /etc/retroarch.cfg
cores_dir = /usr/lib/libretro
cmd_port = 55355
; savestate_auto_save + savestate_auto_load in the generated --appendconfig
resume_on_wake = true

[power]
helper = /usr/lib/rotate/rotate-power-helper
default = balanced

[swivel]
; empty device: pick the evdev node that advertises the EV_SW code below
device =
; lid = SW_LID (thwonp DT, 1 = closed = swivel down), tablet = SW_TABLET_MODE (beebono bring-up doc)
code = lid
closed_value = 1
save_on_close = true
hook_down = /usr/lib/rotate/swivel-down
hook_up = /usr/lib/rotate/swivel-up
; degrees clockwise the touch screen is turned while the swivel is down (direction UNVERIFIED on device)
touch_rotation = 90

[system.gb]
name = Game Boy
core = mgba
extensions = gb zip

[system.gbc]
name = Game Boy Color
core = mgba
extensions = gbc zip

[system.gba]
name = Game Boy Advance
core = mgba
extensions = gba zip

[system.nds]
name = Nintendo DS
; melonds = libretro-melonds (stock Arch package). Switch to `core = melondsds` once the PGO build
; (build/stages/melonds-pgo.sh, needs a profile trained on the device) has been installed as melondsds_libretro.so.
core = melonds
extensions = nds zip

[system.snes]
name = Super Nintendo
core = snes9x
extensions = sfc smc zip

[system.md]
name = Mega Drive
core = genesis_plus_gx
extensions = md gen bin zip

[system.n64]
name = Nintendo 64
core = mupen64plus_next
extensions = n64 z64 v64 zip

[system.psx]
name = PlayStation
core = pcsx_rearmed
extensions = cue chd pbp m3u

[system.nes]
name = Nintendo Entertainment System
core = nestopia
extensions = nes fds unf unif zip

[system.sms]
name = Master System
core = genesis_plus_gx
extensions = sms zip

[system.gg]
name = Game Gear
core = genesis_plus_gx
extensions = gg zip

[system.pce]
name = PC Engine
core = mednafen_pce_fast
extensions = pce cue chd zip

[system.dc]
name = Dreamcast
core = flycast
extensions = cdi gdi chd cue
