# RetroArch udev autoconfig for the RG Rotate gamepad.
#
# input_device: the kernel names a gpio-keys input device after its platform device, and the DT node is
#   `gpio-keys-gamepad` (upstream/linux-mainline-sprd arch/arm64/boot/dts/sprd/ums512-rg-rotate.dts L213; no `label`
#   property on the node, so drivers/input/keyboard/gpio_keys.c L886 falls back to pdev->name).
#   Cross-check: SDL's GUID in plorpOS (portmaster/control.txt: 19007b94...) contains CRC16("gpio-keys-gamepad") = 0x947b,
#   which I recomputed. The name is UNVERIFIED on a running device: confirm with
#   `cat /proc/bus/input/devices | grep -A1 gpio-keys` and `evtest`.
#
# Button numbers: the udev joypad driver numbers the BTN_* codes a device reports in ascending order starting at 0.
#   The DT (L213-L315) reports SOUTH EAST NORTH WEST TL TR TL2 TR2 SELECT START MODE THUMBR + DPAD_UP/DOWN/LEFT/RIGHT, so
#   (assuming the driver's count has no gaps, UNVERIFIED) SOUTH=0 EAST=1 NORTH=2 WEST=3 TL=4 TR=5 TL2=6 TR2=7 SELECT=8
#   START=9 MODE=10, and the BTN_THUMBR key lands at 11 because BTN_THUMBL (0x13d) is not reported. plorpOS reaches
#   the same ordering in SDL (control.txt: a:b0 b:b1 x:b2 y:b3 leftshoulder:b4 ... rightstick:b11 dpup:b12..).
#   If d-pad directions do not work, they are reported as keys and the hat entries below are wrong: check retroarch --verbose.
# Face buttons follow the printed label (DT labels BTN-A/B/X/Y), so the A button is RetroPad A. UNVERIFIED against the shell.
input_driver = "udev"
input_device = "gpio-keys-gamepad"
input_device_display_name = "RG Rotate gamepad"
input_vendor_id = "1"
input_product_id = "1"

input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
# Mode is the hotkey-enable button (retroarch.cfg), not a menu toggle on its own.
input_r3_btn = "11"
input_up_btn = "12"
input_down_btn = "13"
input_left_btn = "14"
input_right_btn = "15"
