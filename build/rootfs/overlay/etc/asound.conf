# Rotate OS ALSA default. Reimplemented from the idea in upstream/MIROKI/system/rootfs/etc/asound.conf (no licence, not copied):
# the SC2730 / AGDSP / VBC path is one speaker at 48 kHz mono (MIROKI note: stereo frames read as mono play an octave
# low), so a `plug` layer pins the hardware side to 48 kHz S16_LE 1 channel and lets ALSA downmix/resample.
# The headphone "Gain" controls are attenuators with no usable hardware volume (same note), so volume is a softvol
# control named "Rotate Playback Volume" on card 0 (created the first time the default PCM opens).
# UNVERIFIED on our kernel/DT: card index 0 and device 0 are assumed; check `aplay -l`. The channel pin is also unverified
# for headphones.
pcm.!default {
    type plug
    slave.pcm "rotate_softvol"
}
pcm.rotate_softvol {
    type softvol
    slave.pcm "rotate_hw48"
    control { name "Rotate Playback Volume"; card 0 }
    min_dB -45.0
    max_dB 0.0
    resolution 16
}
pcm.rotate_hw48 {
    type plug
    slave { pcm "hw:0,0"; rate 48000; format S16_LE; channels 1 }
}
ctl.!default { type hw; card 0 }
