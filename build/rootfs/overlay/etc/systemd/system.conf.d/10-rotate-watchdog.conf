# Hardware watchdog (sprd_wdt, CONFIG_SPRD_WATCHDOG=y, /dev/watchdog0; DT timeout-sec=30, driver range 3..60 s).
# The SoC watchdog only starts counting once userspace opens the device, so PID 1 arms and feeds it.
# systemd pings at half the interval. A hung PID 1 / kernel then resets the unit.
[Manager]
RuntimeWatchdogSec=20s
RebootWatchdogSec=2min
