# USB gadget serial console (g_serial is built in: CONFIG_USB_G_SERIAL=y => /dev/ttyGS0 on the host as ttyACM0).
# Same override as Armbian's anbernic-rg-rotate board (config/boards/anbernic-rg-rotate.csc, function
# ..._console): without it systemd-executor can block on the gadget TTY while holding the /dev/console flock
# and deadlock PID 1. Written fresh here; semantics identical.
[Service]
TTYPath=
TTYReset=no
TTYVHangup=no
StandardInput=null
StandardOutput=journal
StandardError=journal
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --keep-baud --local-line 115200,57600,38400,9600 ttyGS0 $TERM
