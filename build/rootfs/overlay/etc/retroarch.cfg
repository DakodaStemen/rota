# Rotate OS RetroArch base config: RG Rotate (Unisoc T618, Mali-G52 / Panfrost), KMS/DRM, no compositor, 720x720.
# Loaded as `retroarch --config /etc/retroarch.cfg`; the frontend adds a per-launch --appendconfig that repeats
# the network-command and auto-save keys. The file is read-only in practice (config_save_on_exit = false).
#
# Written fresh. MIROKI (no licence) was read for WHICH knobs matter, not copied:
#   upstream/MIROKI/system/rootfs/etc/retroarch.cfg L4-L11 (gl + alsa + udev input/joypad, autoconfig dir),
#   L19-L27 (Mode as hotkey-enable), L29-L38 (directories), tools/build_retroarch.sh L40-L60 (KMS+EGL+GLES build flags).
# Hardware facts: Mesa Panfrost table, https://docs.mesa3d.org/drivers/panfrost.html (G52: OpenGL ES 3.1, OpenGL 3.1).
# Everything marked UNVERIFIED has not run on the device (no hardware attached when this was written).

# ---- video ---------------------------------------------------------------------------------------------------
# "gl", not "glcore": glcore needs a desktop GL 3.2 core context, Panfrost on G52 exposes OpenGL 3.1 / GLES 3.1
# (Mesa table above), so glcore would be refused. "gl" works on both a desktop-GL and a GLES-only RetroArch build
# (MIROKI builds GLES-only and also uses "gl"). Vulkan is not used: PanVK on G52 is not a supported path (research 02 s6.2).
video_driver = "gl"
# Force the DRM/KMS EGL context (ident "kms" in gfx/drivers_context/drm_ctx.c) instead of auto-probing X11/Wayland.
video_context_driver = "kms"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_fullscreen_x = "720"
video_fullscreen_y = "720"
# Threaded video OFF: it adds a frame of latency and a second render thread that competes with the core for the
# two A75 cores; the KMS path flips from the main loop.
video_threaded = "false"
# vsync ON (tearing is visible on a DSI panel), 3 swapchain images = triple buffering so one missed vblank on the
# G52 does not stall the core. Swap to 2 for ~1 frame less input latency at the cost of more dropped frames.
# hard_sync stays off (it stalls the CPU on the GPU every frame).
video_vsync = "true"
video_max_swapchain_images = "3"
video_swap_interval = "1"
video_adaptive_vsync = "false"
video_hard_sync = "false"
video_frame_delay = "0"
# Square panel: keep each core's own aspect ratio, letterbox the rest, bilinear off (crisp pixels, cheaper).
video_aspect_ratio_auto = "true"
video_scale_integer = "false"
video_smooth = "false"
video_shader_enable = "false"
video_refresh_rate = "60.000000"
video_font_enable = "true"
# Do not rotate here: the swivel rotation is handled outside RetroArch (open question Q4 in research 02).
video_rotation = "0"
video_gpu_screenshot = "false"

# ---- audio ---------------------------------------------------------------------------------------------------
# Plain ALSA through /etc/asound.conf (mono 48 kHz speaker path, see that file). No pulse/pipewire daemon: a sink that
# holds the codec PCM open costs ~2.7 mA asleep (plorpOS platform_rotate.c L1828-L1834, as cited in research 02).
audio_driver = "alsa"
audio_device = "default"
audio_out_rate = "48000"
# 64 ms is RetroArch's lowest sane value on a plug/softvol chain; ALSA underruns below ~40 ms are UNVERIFIED on this codec.
audio_latency = "64"
audio_sync = "true"
audio_enable_menu = "false"
audio_resampler = "sinc"
midi_driver = "null"

# ---- control socket the frontend's swivel pause depends on ---------------------------------------------------
# rotate-swiveld sends SAVE_STATE / GET_STATUS / PAUSE_TOGGLE over UDP 55355 (frontend/config/frontend.ini cmd_port).
# Requires a RetroArch built with network commands (HAVE_NETWORK_CMD); stage rootfs checks `retroarch --features`.
network_cmd_enable = "true"
network_cmd_port = "55355"
stdin_cmd_enable = "false"

# ---- resume ------------------------------------------------------------------------------------------------------
savestate_auto_save = "true"
savestate_auto_load = "true"
savestate_thumbnail_enable = "false"
savestate_file_compression = "true"
save_file_compression = "true"
# State slots are never auto-incremented; the auto state is <content>.state.auto next to the states directory.
savestate_auto_index = "false"
config_save_on_exit = "false"
rewind_enable = "false"
run_ahead_enabled = "false"
pause_nonactive = "false"
fastforward_ratio = "0.0"

# ---- input -------------------------------------------------------------------------------------------------------
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
# Our autoconfig profile lives here (rootfs/overlay/usr/share/rotate/autoconfig/udev/gpio-keys-gamepad.cfg).
joypad_autoconfig_dir = "/usr/share/rotate/autoconfig"
input_max_users = "1"
# Mode (button 10 on the gpio-keys-gamepad numbering, see the autoconfig) is hotkey-enable, as on MIROKI.
# Mode + Start exits to the frontend; Mode + R1/L1 save/load state; Mode + R2 fast-forward.
input_enable_hotkey_btn = "10"
input_exit_emulator_btn = "9"
input_save_state_btn = "5"
input_load_state_btn = "4"
input_toggle_fast_forward_btn = "7"
input_menu_toggle_btn = "nul"
# Touch is read by the frontend, not by RetroArch.
input_touch_enable = "false"

# Arch's retroarch is built with the Qt desktop UI. Without a display it aborts ("could not load the Qt platform plugin"),
# observed in the built rootfs under qemu with --menu; switch the companion off so it is never started on KMS.
ui_companion_enable = "false"
ui_companion_start_on_boot = "false"
desktop_menu_enable = "false"

# ---- menu: minimal, the Rotate frontend is the real menu --------------------------------------------------------
menu_driver = "rgui"
menu_enable_widgets = "false"
menu_mouse_enable = "false"
menu_pointer_enable = "false"
menu_show_load_content_animation = "false"
quick_menu_show_take_screenshot = "false"
notification_show_autoconfig = "false"
notification_show_config_override_load = "false"
notification_show_remap_load = "false"
notification_show_refresh_rate = "false"
notification_show_save_state = "true"

# ---- paths ------------------------------------------------------------------------------------------------------
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
system_directory = "/roms/bios"
rgui_browser_directory = "/roms"
savefile_directory = "/var/lib/rotate/saves"
savestate_directory = "/var/lib/rotate/states"
screenshot_directory = "/var/lib/rotate/screenshots"
playlist_directory = "/var/lib/rotate/playlists"
cache_directory = "/tmp/retroarch"
log_to_file = "false"
content_runtime_log = "true"
runtime_log_directory = "/var/lib/rotate/logs"
core_updater_auto_extract_archive = "false"
menu_show_online_updater = "false"
